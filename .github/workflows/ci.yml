name: CI Beber Água

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate App Integrity
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar Repositório
      uses: actions/checkout@v4

    - name: 🟢 Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 📦 Instalar Dependências
      run: npm ci

    - name: 🔍 Validar Sintaxe JavaScript (Node Check)
      run: |
        node -c main.js
        node -c renderer.js
        node -c preload.js
        node -c sw.js
